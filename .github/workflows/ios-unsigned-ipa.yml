# Builds an UNSIGNED iOS .ipa on a macOS runner (no Apple Developer account
# needed). Sideloadly re-signs it with a free Apple ID and installs it over
# USB — see docs/ios-sideloadly.md for the user-executed checklist.
#
# EAS cannot produce iOS device builds without a paid account, hence this
# workflow.
name: iOS unsigned IPA

on:
  workflow_dispatch:
    inputs:
      supabase_url:
        description: "EXPO_PUBLIC_SUPABASE_URL baked into the build (hosted Supabase project URL)"
        required: true
        type: string
      supabase_anon_key:
        description: "EXPO_PUBLIC_SUPABASE_ANON_KEY baked into the build (anon/publishable key — not a secret)"
        required: true
        type: string
      sentry_dsn:
        description: "Optional EXPO_PUBLIC_SENTRY_DSN. Leave empty to use the SENTRY_DSN repo variable; if neither exists, crash reporting stays off."
        required: false
        default: ""
        type: string

jobs:
  build-ipa:
    # Expo SDK 58 targets iOS 27 and React Native 0.88's codegen needs a modern
    # Swift toolchain. The xcode-27 image (macOS 27, arm64) is GitHub's GA
    # runner for that toolchain; macos-26 still ships Xcode 26.6.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ inputs.supabase_url }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ inputs.supabase_anon_key }}
      # The DSN is public by design; the repo variable keeps it in every build
      # without a human retyping it, and the manual input still overrides it.
      EXPO_PUBLIC_SENTRY_DSN: ${{ inputs.sentry_dsn || vars.SENTRY_DSN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG || 'bukit-pennies' }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'mobile' }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      # Without a token the expo plugin's upload build phase fails the archive.
      # With one, it uploads source maps and the stack traces are readable.
      SENTRY_DISABLE_AUTO_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN == '' && 'true' || 'false' }}
    steps:
      # Full history: the build number is the commit count and the short SHA is
      # the commit the binary was made from. A shallow clone would produce a
      # build number that changes whenever the fetch depth does.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build identity
        run: |
          VERSION=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' apps/mobile/app.json | head -1)
          BUILD=$(git rev-list --count HEAD)
          echo "BUKIT_BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "BUKIT_GIT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          # Sentry Cocoa's default release is "<bundle id>@<version>+<build>".
          # Pinning it here keeps the app, the dSYM upload and the CLI release
          # step on one exact string instead of three guesses.
          echo "SENTRY_RELEASE=com.bukitpennies.app@${VERSION}+${BUILD}" >> "$GITHUB_ENV"
          echo "SENTRY_DIST=$BUILD" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A release is what turns "an error happened" into "this started in build
      # 143". Without it Sentry groups crashes but cannot call a regression.
      - name: Create Sentry release
        if: env.SENTRY_AUTH_TOKEN != ''
        run: |
          npx --yes @sentry/cli@2 releases new "$SENTRY_RELEASE" \
            --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" || true
          npx --yes @sentry/cli@2 releases set-commits "$SENTRY_RELEASE" --auto \
            --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" || true
          npx --yes @sentry/cli@2 releases finalize "$SENTRY_RELEASE" \
            --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" || true

      # Generates apps/mobile/ios (CocoaPods install included).
      - name: Expo prebuild (iOS)
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install && pod install --project-directory=ios

      # Raw output on purpose: resolution failures print their cause here,
      # where xcbeautify can't swallow it.
      - name: Resolve Swift package dependencies
        working-directory: apps/mobile
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          xcodebuild -resolvePackageDependencies \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME"

      # -destination, not -sdk: RN codegen's local Swift package fails to
      # resolve under `-sdk iphoneos`.
      - name: Archive without code signing
        working-directory: apps/mobile
        env:
          # Force a stable map path instead of $DERIVED_FILE_DIR, which Xcode
          # cleans up. The Sentry build phase reads this variable, generates the
          # map and uploads it against SENTRY_RELEASE/SENTRY_DIST.
          SOURCEMAP_FILE: ${{ github.workspace }}/apps/mobile/build/main.jsbundle.map
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/app.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/xcodebuild.log | xcbeautify --renderer github-actions \
            || { echo '===== raw log tail (beautifier hides script-phase stderr) ====='; tail -n 400 build/xcodebuild.log; exit 65; }

      - name: Upload raw xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: apps/mobile/build/xcodebuild.log
          retention-days: 7

      # Proves the JS map was generated, not just assumed. A map that is absent
      # or empty means sourcemaps were never uploaded, even if the build passed.
      - name: Verify JS source map
        working-directory: apps/mobile
        run: |
          ls -lh build/main.jsbundle.map
          test -s build/main.jsbundle.map

      - name: Upload source map artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main.jsbundle-map
          path: apps/mobile/build/main.jsbundle.map
          if-no-files-found: warn
          retention-days: 7

      - name: Package unsigned .ipa
        working-directory: apps/mobile
        run: |
          APP=$(ls -d build/app.xcarchive/Products/Applications/*.app | head -1)
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry bukit-pennies-unsigned.ipa Payload)
          ls -lh build/bukit-pennies-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: bukit-pennies-unsigned-ipa
          path: apps/mobile/build/bukit-pennies-unsigned.ipa
          retention-days: 14
