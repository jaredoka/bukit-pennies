name: Crash alerts

# Sentry issue -> Discord, every 15 minutes. Free on a public repo.
#
# State lives on the orphan branch `automation-state` so a delayed or repeated
# run cannot ping the same crash twice. Nothing is committed to `main`.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test message to Discord and exit"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: crash-alerts
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: node --check .github/scripts/crash-alert.mjs

      - name: Load alert state
        if: ${{ !inputs.test }}
        run: |
          git fetch --depth=1 origin automation-state || true
          if git cat-file -e FETCH_HEAD:state.json 2>/dev/null; then
            git show FETCH_HEAD:state.json > "$RUNNER_TEMP/state.json"
          else
            echo '{"issues":[]}' > "$RUNNER_TEMP/state.json"
          fi

      - name: Alert on new crash issues
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || 'bukit-pennies' }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'mobile' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATE_FILE: ${{ runner.temp }}/state.json
          TEST: ${{ inputs.test && '1' || '0' }}
        run: node .github/scripts/crash-alert.mjs

      - name: Save alert state
        if: ${{ !inputs.test && env.STATE_CHANGED == '1' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STATE_DIR="$RUNNER_TEMP/state-repo"
          git clone --quiet --depth=1 --branch automation-state \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$STATE_DIR" 2>/dev/null \
            || {
              mkdir -p "$STATE_DIR"
              cd "$STATE_DIR"
              git init --quiet
              git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
              git checkout --quiet --orphan automation-state
            }
          cp "$RUNNER_TEMP/state.json" "$STATE_DIR/state.json"
          cd "$STATE_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit --quiet -m "state: crash alert dedupe"
          git push --quiet origin HEAD:automation-state
