project_id = "bukit-pennies"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = [
  "http://localhost:8081",
  "http://localhost:8081/reset-password",
  "bukitpennies://reset-password",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.ingest]
# Auth for /ingest is our own static device token (an iOS Shortcut / background
# service can only attach a fixed header), NOT a Supabase JWT.
verify_jwt = false

[functions.feedback]
# Bug reports and feature requests come from a signed-in app user, so the
# gateway validates the JWT and the function inserts through the caller's
# token — RLS stays the boundary. This is the default; stated explicitly so the
# contrast with /ingest above is on the page.
verify_jwt = true
